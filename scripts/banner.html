<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1024px;
      height: 500px;
      overflow: hidden;
      background-color: #0A0A0B;
    }
    .container {
      width: 1024px;
      height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0A0A0B;
    }
    .heading {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 56px;
      font-weight: 300;
      color: #E6E4DD;
      letter-spacing: -0.02em;
      line-height: 1;
      text-align: center;
    }
    .subtitle {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 22px;
      font-style: italic;
      font-weight: 300;
      color: #8C8A82;
      margin-top: 12px;
      line-height: 1;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="heading">nook.</div>
    <div class="subtitle">your pocket sanctuary</div>
  </div>
</body>
</html>
